name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npx tsc --noEmit
      - name: build
        run: npm run build

  record-hashes:
    # append {slug: short-sha} for newly merged posts to content/commits.json
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: record commit hashes for new posts
        run: |
          set -euo pipefail
          MAP=content/commits.json
          [ -f "$MAP" ] || echo '{}' > "$MAP"
          changed=0
          for f in content/blog/*.md; do
            slug=$(basename "$f" .md)
            if [ -z "$(jq -r --arg s "$slug" '.[$s] // empty' "$MAP")" ]; then
              hash=$(git log --diff-filter=A --format=%h -1 -- "$f")
              [ -n "$hash" ] || continue
              jq --arg s "$slug" --arg h "$hash" '.[$s] = $h' "$MAP" > "$MAP.tmp" && mv "$MAP.tmp" "$MAP"
              changed=1
            fi
          done
          if [ "$changed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$MAP"
            git commit -m "chore: record post commit hashes [skip ci]"
            git push
          fi

  deploy:
    # ponytail: Vercel via CLI; wire VERCEL_TOKEN/ORG_ID/PROJECT_ID secrets to activate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [checks, record-hashes]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pick up the commits.json the recorder may have just pushed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping deploy"
            exit 0
          fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
